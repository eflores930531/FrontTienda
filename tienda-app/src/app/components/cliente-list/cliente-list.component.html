<div class="container mt-4">
    <h2 class="text-center mb-4">Lista de Clientes</h2>
    
    <div class="d-flex justify-content-between align-items-center mb-3">
      <a routerLink="/cliente-form" class="btn btn-primary">
        <i class="bi bi-person-plus-fill"></i> Agregar Cliente
      </a>
    </div>
  
    <div class="table-responsive">
      <table class="table table-striped table-hover shadow-sm">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Email</th>
            <th>Dirección</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let cliente of clientes">
            <td>{{ cliente.clienteID }}</td>
            <td>{{ cliente.nombre }}</td>
            <td>{{ cliente.email }}</td>
            <td>{{ cliente.direccion }}</td>
            <td>
              <a [routerLink]="['/cliente-form', cliente.clienteID]" class="btn btn-warning btn-sm">
                <i class="bi bi-pencil-square"></i> Editar
              </a>
              <button class="btn btn-danger btn-sm ms-2" (click)="deleteCliente(cliente.clienteID)">
                <i class="bi bi-trash"></i> Eliminar
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
